sonar.projectKey=tms
sonar.projectName=Test Management System
sonar.projectVersion=1.0

sonar.sources=app,lib
sonar.tests=tests
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/node_modules/**,**/.next/**,**/prisma/migrations/**,**/*.tsx,**/prisma/**

sonar.coverage.exclusions=**/*.tsx,**/prisma/**,**/node_modules/**

sonar.typescript.lcov.reportPaths=reports/vitest/coverage/lcov.info

sonar.host.url=http://localhost:9000
