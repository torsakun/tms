<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/fonts.css">
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/typography.css">
<link rel="stylesheet" href="qm-tokens.css">
<script src="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/_ds_bundle.js"></script>
</helmet>
<div data-screen-label="Profile settings" style="width:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:600px;">
  <div style="padding:18px 22px; border-bottom:1px solid var(--border); background:var(--surface);">
    <div style="font-size:18px; font-weight:600; letter-spacing:-0.01em;">Profile</div>
    <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">Manage your account and sign-in details</div>
  </div>

  <div style="flex:1; padding:28px 22px; overflow:auto;">
    <div style="max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:24px;">

      <!-- avatar block -->
      <div style="display:flex; align-items:center; gap:18px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:18px 20px; box-shadow:var(--shadow-sm);">
        <div style="width:64px; height:64px; border-radius:999px; background:var(--primary-soft); color:var(--primary-text); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700;">JL</div>
        <div style="flex:1;">
          <div style="font-size:15px; font-weight:600;">Jordan Lee</div>
          <div style="font-size:12.5px; color:var(--text-muted);">Admin · Checkout Inc.</div>
        </div>
        <x-import component-from-global-scope="S9DesignSystem_874ecb.Button" hint-size="120px,36px" variant="outline" size="sm" leading-icon="photo_camera" style="{{ btn }}">Change photo</x-import>
      </div>

      <!-- account fields -->
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:20px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:16px;">
        <div style="font-size:13px; font-weight:600;">Account</div>
        <div>
          <label style="display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:7px;">Display name</label>
          <div style="display:flex; align-items:center; height:42px; padding:0 13px; border-radius:11px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); font-size:14px;">Jordan Lee</div>
        </div>
        <div>
          <label style="display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:7px;">Email address</label>
          <div style="display:flex; align-items:center; gap:9px; height:42px; padding:0 13px; border-radius:11px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--border); font-size:14px; color:var(--text-muted);"><span class="material-symbols-rounded" style="font-size:18px; color:var(--text-faint);">mail</span>jordan@checkout.dev<span style="margin-left:auto; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--pass-soft); color:var(--pass);">Verified</span></div>
        </div>
      </div>

      <!-- change password -->
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:20px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:16px;">
        <div><div style="font-size:13px; font-weight:600;">Change password</div><div style="font-size:12px; color:var(--text-faint); margin-top:2px;">Use at least 12 characters with a number and a symbol.</div></div>
        <div>
          <label style="display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:7px;">Current password</label>
          <div style="display:flex; align-items:center; gap:9px; height:42px; padding:0 13px; border-radius:11px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); font-size:14px; letter-spacing:2px; color:var(--text-muted);"><span class="material-symbols-rounded" style="font-size:18px; color:var(--text-faint); letter-spacing:0;">lock</span>••••••••</div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div>
            <label style="display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:7px;">New password</label>
            <div style="display:flex; align-items:center; height:42px; padding:0 13px; border-radius:11px; background:var(--surface); box-shadow:inset 0 0 0 2px var(--ring); font-size:14px; letter-spacing:2px; color:var(--text-muted);">••••••••••</div>
          </div>
          <div>
            <label style="display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:7px;">Confirm</label>
            <div style="display:flex; align-items:center; height:42px; padding:0 13px; border-radius:11px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); font-size:14px; letter-spacing:2px; color:var(--text-muted);">••••••••••</div>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;"><div style="flex:1; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;"><div style="width:78%; height:100%; background:var(--pass);"></div></div><span style="font-size:11.5px; font-weight:600; color:var(--pass);">Strong</span></div>
      </div>
    </div>
  </div>

  <!-- sticky footer -->
  <div style="display:flex; align-items:center; justify-content:flex-end; gap:9px; padding:13px 22px; background:var(--surface); border-top:1px solid var(--border);">
    <x-import component-from-global-scope="S9DesignSystem_874ecb.Button" hint-size="90px,40px" variant="ghost" style="{{ btn2 }}">Cancel</x-import>
    <div style="display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 18px; border-radius:10px; background:var(--primary); color:var(--primary-fg); font-weight:600; font-size:14px; box-shadow:var(--shadow-sm);"><span style="width:14px; height:14px; border-radius:999px; border:2px solid color-mix(in oklab, var(--primary-fg) 40%, transparent); border-top-color:var(--primary-fg); animation:qm-spin .7s linear infinite;"></span>Saving…</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){ return { btn: { height: 36, borderRadius: 9, fontSize: 13 }, btn2: { height: 40, borderRadius: 10, fontSize: 14 } }; }
}
</script>
</body>
</html>
