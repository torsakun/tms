<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/fonts.css">
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/typography.css">
<link rel="stylesheet" href="qm-tokens.css">
<script src="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/_ds_bundle.js"></script>
</helmet>
<div data-screen-label="Members" style="width:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;">

  <!-- workspace header -->
  <div style="padding:18px 22px 0; background:var(--surface); border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <div style="width:30px; height:30px; border-radius:9px; background:var(--primary-soft); color:var(--primary-text); display:flex; align-items:center; justify-content:center;"><span class="material-symbols-rounded" style="font-size:19px;">corporate_fare</span></div>
      <div style="font-size:18px; font-weight:600; letter-spacing:-0.01em;">Workspace</div>
      <span style="font-size:13px; color:var(--text-faint);">· Checkout Inc.</span>
    </div>
    <div style="display:flex; gap:2px;">
      <sc-for list="{{ wsTabs }}" as="t" hint-placeholder-count="5">
        <div style="padding:10px 12px 9px; font-weight:{{ t.weight }}; font-size:13px; color:{{ t.color }}; border-bottom:2px solid {{ t.border }}; margin-bottom:-1px;">{{ t.label }}</div>
      </sc-for>
      <div style="flex:1;"></div>
      <div style="padding:10px 12px 9px; font-weight:500; font-size:13px; color:var(--text-faint); display:flex; align-items:center; gap:5px;"><span class="material-symbols-rounded" style="font-size:17px;">settings</span>Configuration</div>
    </div>
  </div>

  <div style="padding:20px 22px; max-width:1180px;">
    <!-- toolbar -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <div style="font-size:16px; font-weight:600;">Users <span style="color:var(--text-faint); font-weight:400;">· 24</span></div>
      <div style="flex:1;"></div>
      <div style="display:flex; align-items:center; gap:8px; height:36px; padding:0 11px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); border-radius:9px; color:var(--text-faint); font-size:12.5px; min-width:200px;"><span class="material-symbols-rounded" style="font-size:17px;">search</span>Search members</div>
      <div style="display:flex; align-items:center; gap:6px; height:36px; padding:0 12px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); border-radius:9px; font-size:12.5px; font-weight:500;">All roles<span class="material-symbols-rounded" style="font-size:17px; color:var(--text-faint);">expand_more</span></div>
      <x-import component-from-global-scope="S9DesignSystem_874ecb.Button" hint-size="140px,36px" variant="primary" size="sm" leading-icon="person_add" style="{{ btn }}">Invite member</x-import>
    </div>

    <!-- table -->
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:13px; box-shadow:var(--shadow-sm); overflow:hidden;">
      <div style="display:grid; grid-template-columns:2fr 1.2fr 110px 110px 40px; gap:14px; padding:10px 18px; font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint); border-bottom:1px solid var(--border);">
        <div>Member</div><div>Role</div><div>Status</div><div>Last seen</div><div></div>
      </div>
      <sc-for list="{{ users }}" as="u" hint-placeholder-count="7">
        <div style="display:grid; grid-template-columns:2fr 1.2fr 110px 110px 40px; gap:14px; padding:12px 18px; align-items:center; border-bottom:1px solid var(--border);">
          <div style="display:flex; align-items:center; gap:11px; min-width:0;">
            <div style="width:32px; height:32px; border-radius:999px; background:{{ u.avBg }}; color:{{ u.avColor }}; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;">{{ u.initials }}</div>
            <div style="min-width:0;"><div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ u.name }}</div><div style="font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ u.email }}</div></div>
          </div>
          <div><span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:7px; background:{{ u.roleBg }}; color:{{ u.roleColor }};">{{ u.role }}</span></div>
          <div><span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:{{ u.statusColor }};"><span style="width:7px; height:7px; border-radius:999px; background:{{ u.statusColor }};"></span>{{ u.status }}</span></div>
          <div style="font-size:12px; color:var(--text-muted);">{{ u.seen }}</div>
          <div style="display:flex; justify-content:center;"><span class="material-symbols-rounded" style="font-size:19px; color:var(--text-faint);">more_horiz</span></div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:14px;">
      <span style="font-size:12px; color:var(--text-faint);">24 members · 22 active</span>
      <x-import component-from-global-scope="S9DesignSystem_874ecb.Pagination" page="1" total="24" per-page="7" size="sm" hint-size="240px,32px"></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const btn = { height: 36, borderRadius: 9, fontSize: 13 };
    const tab=(label,sel)=>({ label, weight: sel?'600':'500', color: sel?'var(--primary-text)':'var(--text-muted)', border: sel?'var(--primary)':'transparent' });
    const wsTabs=[ tab('Users',true), tab('Invites'), tab('Groups'), tab('Roles') ];
    const roleStyle={ Admin:['var(--primary-soft)','var(--primary-text)'], 'Test lead':['var(--info-soft-fill)','var(--info)'], Engineer:['var(--surface-2)','var(--text-muted)'], Viewer:['var(--surface-2)','var(--text-faint)'] };
    const avs=[['var(--primary-soft)','var(--primary-text)'],['var(--info-soft-fill)','var(--info)'],['var(--pass-soft)','var(--pass)'],['var(--warn-soft)','var(--warn)']];
    const mk=(name,email,role,status,seen,i)=>({ name, email, role, initials:name.split(' ').map(w=>w[0]).join('').slice(0,2),
      roleBg:roleStyle[role][0], roleColor:roleStyle[role][1],
      status, statusColor: status==='Active'?'var(--pass)':'var(--text-faint)',
      seen, avBg:avs[i%4][0], avColor:avs[i%4][1] });
    const users=[
      mk('Jordan Lee','jordan@checkout.dev','Admin','Active','Just now',0),
      mk('Mara Alvarez','mara@checkout.dev','Test lead','Active','12 min ago',1),
      mk('Ravi Kapoor','ravi@checkout.dev','Engineer','Active','1 h ago',2),
      mk('Sam Park','sam@checkout.dev','Engineer','Active','3 h ago',3),
      mk('Lin Qiu','lin@checkout.dev','Test lead','Active','Yesterday',0),
      mk('Tom Becker','tom@checkout.dev','Viewer','Inactive','24 days ago',1),
      mk('Nadia Hassan','nadia@checkout.dev','Engineer','Active','2 days ago',2),
    ];
    return { wsTabs, users, btn };
  }
}
</script>
</body>
</html>
