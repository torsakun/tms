<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/fonts.css">
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/tokens/typography.css">
<link rel="stylesheet" href="qm-tokens.css">
<script src="_ds/s9-headless-ui-design-system-874ecbf7-9fc1-4ab6-bccf-c3704fc12ec6/_ds_bundle.js"></script>
</helmet>
<div data-screen-label="Groups" style="width:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; position:relative; overflow:hidden;">
  <div style="padding:18px 22px 0; background:var(--surface); border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;"><div style="width:30px; height:30px; border-radius:9px; background:var(--primary-soft); color:var(--primary-text); display:flex; align-items:center; justify-content:center;"><span class="material-symbols-rounded" style="font-size:19px;">corporate_fare</span></div><div style="font-size:18px; font-weight:600; letter-spacing:-0.01em;">Workspace</div></div>
    <div style="display:flex; gap:2px;"><sc-for list="{{ wsTabs }}" as="t" hint-placeholder-count="4"><div style="padding:10px 12px 9px; font-weight:{{ t.weight }}; font-size:13px; color:{{ t.color }}; border-bottom:2px solid {{ t.border }}; margin-bottom:-1px;">{{ t.label }}</div></sc-for></div>
  </div>

  <div style="padding:20px 22px; max-width:1000px;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <div style="font-size:16px; font-weight:600;">Groups <span style="color:var(--text-faint); font-weight:400;">· 4</span></div>
      <div style="flex:1;"></div>
      <x-import component-from-global-scope="S9DesignSystem_874ecb.Button" hint-size="130px,36px" variant="primary" size="sm" leading-icon="group_add" style="{{ btn }}">Create group</x-import>
    </div>
    <div style="display:flex; flex-direction:column; gap:11px;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div style="display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:15px 18px; box-shadow:var(--shadow-sm);">
          <div style="width:38px; height:38px; border-radius:10px; background:{{ g.iconBg }}; color:{{ g.iconColor }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><span class="material-symbols-rounded" style="font-size:20px;">{{ g.icon }}</span></div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:600;">{{ g.name }}</div>
            <div style="display:flex; gap:5px; margin-top:5px; flex-wrap:wrap;"><sc-for list="{{ g.projects }}" as="p" hint-placeholder-count="2"><span style="font-size:10.5px; font-weight:600; padding:1px 8px; border-radius:6px; background:var(--surface-2); color:var(--text-muted);">{{ p }}</span></sc-for></div>
          </div>
          <div style="display:flex; align-items:center; gap:14px;">
            <div style="display:flex; align-items:center; gap:8px;"><div style="display:flex;"><sc-for list="{{ g.members }}" as="m" hint-placeholder-count="3"><div style="width:24px; height:24px; border-radius:999px; background:{{ m.bg }}; color:{{ m.color }}; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; margin-left:{{ m.ml }}; box-shadow:0 0 0 2px var(--surface);">{{ m.i }}</div></sc-for></div><span style="font-size:11.5px; color:var(--text-faint);">{{ g.count }}</span></div>
            <div style="display:flex; gap:3px;"><div style="width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-muted);"><span class="material-symbols-rounded" style="font-size:17px;">edit</span></div><div style="width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-faint);"><span class="material-symbols-rounded" style="font-size:18px;">delete</span></div></div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- slide-over drawer -->
  <div style="position:absolute; top:0; right:0; bottom:0; width:380px; background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); display:flex; flex-direction:column; animation:qm-drawer-in .2s ease;">
    <div style="display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border);">
      <div style="flex:1;"><div style="font-size:15px; font-weight:600;">Edit group</div><div style="font-size:12px; color:var(--text-faint);">Payments squad</div></div>
      <span class="material-symbols-rounded" style="font-size:20px; color:var(--text-faint);">close</span>
    </div>
    <div style="padding:16px 18px; display:flex; flex-direction:column; gap:16px; flex:1; overflow:auto;">
      <div><label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px;">Group name</label><div style="display:flex; align-items:center; height:40px; padding:0 13px; border-radius:10px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); font-size:13.5px;">Payments squad</div></div>
      <div>
        <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:8px;">Members <span style="color:var(--text-faint);">· 3 selected</span></label>
        <div style="display:flex; align-items:center; gap:8px; height:36px; padding:0 11px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); border-radius:9px; color:var(--text-faint); font-size:12.5px; margin-bottom:10px;"><span class="material-symbols-rounded" style="font-size:17px;">search</span>Search members</div>
        <div style="display:flex; flex-direction:column; gap:2px;">
          <sc-for list="{{ picker }}" as="m" hint-placeholder-count="6">
            <div style="display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:9px; background:{{ m.bg }};">
              <div style="width:18px; height:18px; border-radius:5px; box-shadow:{{ m.boxShadow }}; background:{{ m.boxBg }}; display:flex; align-items:center; justify-content:center;"><span class="material-symbols-rounded fill" style="font-size:13px; color:var(--primary-fg); visibility:{{ m.checkVis }};">check</span></div>
              <div style="width:26px; height:26px; border-radius:999px; background:{{ m.avBg }}; color:{{ m.avColor }}; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;">{{ m.i }}</div>
              <div style="flex:1; min-width:0;"><div style="font-size:12.5px; font-weight:500;">{{ m.name }}</div></div>
              <span style="font-size:10.5px; color:var(--text-faint);">{{ m.role }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="display:flex; gap:9px; padding:14px 18px; border-top:1px solid var(--border);">
      <x-import component-from-global-scope="S9DesignSystem_874ecb.Button" hint-size="100%,38px" variant="ghost" size="sm" full-width="{{ true }}" style="{{ btn3 }}">Cancel</x-import>
      <x-import component-from-global-scope="S9DesignSystem_874ecb.Button" hint-size="100%,38px" variant="primary" size="sm" full-width="{{ true }}" leading-icon="check" style="{{ btn3 }}">Save group</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const btn = { height: 36, borderRadius: 9, fontSize: 13 };
    const btn3 = { height: 38, borderRadius: 9, fontSize: 13 };
    const tab=(label,sel)=>({ label, weight: sel?'600':'500', color: sel?'var(--primary-text)':'var(--text-muted)', border: sel?'var(--primary)':'transparent' });
    const wsTabs=[ tab('Users'), tab('Invites'), tab('Groups',true), tab('Roles') ];
    const avs=[['var(--primary-soft)','var(--primary-text)'],['var(--info-soft-fill)','var(--info)'],['var(--pass-soft)','var(--pass)'],['var(--warn-soft)','var(--warn)']];
    const stack=(arr)=>arr.map((i,idx)=>({ i, bg:avs[idx%4][0], color:avs[idx%4][1], ml: idx===0?'0':'-7px' }));
    const ic=[['var(--primary-soft)','var(--primary-text)'],['var(--info-soft-fill)','var(--info)'],['var(--pass-soft)','var(--pass)'],['var(--warn-soft)','var(--warn)']];
    const mk=(name,projects,members,count,icon,ci)=>({ name, projects, members:stack(members), count:count+' members', icon, iconBg:ic[ci][0], iconColor:ic[ci][1] });
    const groups=[
      mk('Checkout core',['Checkout Web','Search'],['JL','MA','RK','SP'],8,'shopping_cart',0),
      mk('Payments squad',['Payments API'],['RK','LQ','MA'],5,'payments',1),
      mk('Platform QA',['Auth Service','Mobile Web'],['SP','JL','NH'],6,'hub',2),
      mk('Release managers',['All projects'],['JL','LQ'],3,'flag',3),
    ];
    const mkp=(name,role,sel,i)=>({ name, role, i:name.split(' ').map(w=>w[0]).join('').slice(0,2), avBg:avs[i%4][0], avColor:avs[i%4][1],
      bg: sel?'var(--primary-soft)':'transparent', boxShadow: sel?'none':'inset 0 0 0 1.5px var(--border-strong)', boxBg: sel?'var(--primary)':'var(--surface)', checkVis: sel?'visible':'hidden' });
    const picker=[
      mkp('Ravi Kapoor','Engineer',true,2), mkp('Lin Qiu','Test lead',true,0), mkp('Mara Alvarez','Test lead',true,1),
      mkp('Sam Park','Engineer',false,3), mkp('Nadia Hassan','Engineer',false,2), mkp('Tom Becker','Viewer',false,1),
    ];
    return { wsTabs, groups, picker, btn, btn3 };
  }
}
</script>
</body>
</html>
