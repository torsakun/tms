name: Automated Database Backup

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate Backup Timestamp
        id: timestamp
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Dump Database
        run: |
          # Use pg_dump to extract the full database schema and data
          pg_dump $DATABASE_URL -F c > backup-${{ steps.timestamp.outputs.date }}.dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.timestamp.outputs.date }}
          path: backup-*.dump
          retention-days: 30 # Backups older than 30 days are automatically deleted
